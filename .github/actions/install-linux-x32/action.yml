name: Install
runs:
  using: composite
  steps:
    - shell: bash
      run: |
        set -x
        sudo make install
        sudo mkdir -p /etc/php.d
        sudo chmod 777 /etc/php.d
        echo mysqli.default_socket=/var/run/mysqld/mysqld.sock | sudo tee /etc/php.d/mysqli.ini > /dev/null
        echo pdo_mysql.default_socket=/var/run/mysqld/mysqld.sock | sudo tee /etc/php.d/pdo_mysql.ini > /dev/null
        echo opcache.enable_cli=1 | sudo tee /etc/php.d/opcache.ini > /dev/null
        echo opcache.protect_memory=1 | sudo tee -a /etc/php.d/opcache.ini > /dev/null
        echo opcache.preload_user=root | sudo tee -a /etc/php.d/opcache.ini > /dev/null

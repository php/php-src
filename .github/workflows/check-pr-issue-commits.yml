name: Require issue references in pull request commits

on:
  pull_request_target:
    types:
      - opened
      - edited
      - reopened
      - synchronize
      - ready_for_review

permissions:
  contents: none

jobs:
  check-issue-commits:
    if: github.repository == 'php/php-src'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const title = context.payload.pull_request.title;
            const references = [...title.matchAll(/\bFix GH-(\d+)\b/g)];

            if (references.length === 0) {
              return;
            }

            if (references.length !== 1) {
              core.setFailed('The PR title must reference exactly one issue with "Fix GH-XXXXX".');
              return;
            }

            const issueNumber = references[0][1];
            const commits = await github.paginate(github.rest.pulls.listCommits, {
              ...context.repo,
              pull_number: context.issue.number,
              per_page: 100,
            });
            const closingReference = new RegExp(`\\bFixes\\s+#${issueNumber}\\b`, 'i');
            const missingReferences = commits.filter(({ commit }) => {
              const [, ...descriptionLines] = commit.message.split(/\r?\n/);
              return !closingReference.test(descriptionLines.join('\n'));
            });

            if (missingReferences.length > 0) {
              const details = missingReferences
                .map(({ sha, commit }) => `- ${sha.slice(0, 7)} ${commit.message.split(/\r?\n/, 1)[0]}`)
                .join('\n');
              core.setFailed(
                `Every commit in a PR titled "Fix GH-${issueNumber}" must include "Fixes #${issueNumber}" in its commit message description.\n${details}`,
              );
            }
